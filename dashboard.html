<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src https:;">
<meta charset="UTF-8">
<title>Dashboard - Passafiume A.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">

<div class="navbar">
  <div class="navbar-inner">
    <h2>
      Affitto Manager 
      <span id="contractBadge" style="margin-left:10px;"></span>
    </h2>

    <div class="navbar-actions">
      <button class="pdf-btn" onclick="generatePDF()">
        📄 Scarica Riepilogo PDF
      </button>

      <span id="userName"></span>
      <button id="logout">Logout</button>
    </div>
  </div>
</div>

<div class="container">

  <div class="card collapsible">
    <div class="card-header" onclick="toggleSection(this)">
      <h3>Profilo</h3>
    </div>

    <div style="text-align:center; margin-top:15px;">
      <img id="avatarPreview"
           style="width:120px;border-radius:50%;margin-bottom:10px;">
    </div>

    <div class="card-body">
      <input type="file" id="avatarInput">
      <input type="text" id="nome" placeholder="Nome">
      <input type="text" id="cognome" placeholder="Cognome">
      <input type="date" id="dataNascita">
      <button id="saveProfile">Salva Profilo</button>
    </div>
  </div>

  <div class="card collapsible">
  <div class="card-header" onclick="toggleSection(this)">
    <h3 data-section="caparra">Caparra PAGATA</h3>
  </div>
  <div class="card-body">
    <input type="file" id="caparraInput" accept=".pdf,image/*" multiple>
    <button onclick="uploadDocument('caparra', 'caparraInput')">Carica</button>
    <div id="caparraPreview"></div>
  </div>
</div>

  <div class="card collapsible">
  <div class="card-header" onclick="toggleSection(this)">
    <h3 data-section="contrattoAffitto">Contratto di SUBLOCAZIONE</h3>
  </div>

  <div class="card-body">

    <input type="file"
           id="contrattoAffittoInput"
           accept=".pdf,image/*"
           multiple>

    <button onclick="uploadDocument('contrattoAffitto', 'contrattoAffittoInput')">
      Carica
    </button>

    <div id="contrattoAffittoPreview"></div>

  </div>
</div>

<div class="card collapsible">
  <div class="card-header" onclick="toggleSection(this)">
    <h3 data-section="registrazione">Registrazione Contratto - Agenzia delle Entrate</h3>
  </div>
  <div class="card-body">
    <input type="file" id="registrazioneInput" multiple>
    <button onclick="uploadDocument('registrazione', 'registrazioneInput', 'registrazionePreview')">Carica</button>
    <div id="registrazionePreview"></div>
  </div>
</div>

<div class="card collapsible">
  <div class="card-header" onclick="toggleSection(this)">
    <h3 data-section="fattura">Fattura Agenzia con Coordinate Bancarie PAGATO</h3>
  </div>
  <div class="card-body">
    <input type="file" id="fatturaInput" multiple>
    <button onclick="uploadDocument('fattura', 'fatturaInput', 'fatturaPreview')">Carica</button>
    <div id="fatturaPreview"></div>
  </div>
</div>

<div class="card collapsible contract-settings">
  <div class="card-header" onclick="toggleSection(this)">
    <h3>Impostazioni Contratto</h3>
  </div>

  <div class="card-body contract-body">

    <input type="number" id="importoPrimoMensile" placeholder="Importo Primo Mese (€)">
    <input type="number" id="importoMensile" placeholder="Importo Mensile (€)">
    <input type="number" id="numeroMesi" placeholder="Numero Mesi">
    <input type="number" id="caparraImporto" placeholder="Caparra (€)">
    <input type="date" id="dataInizio">
    <input type="date" id="dataFine">

    <button onclick="saveContractSettings()">Salva Impostazioni</button>

  </div>
</div>

  <div class="card collapsible pagamenti-card">
  <div class="card-header" onclick="toggleSection(this)">
    <h3>Pagamenti</h3>
  </div>
  <div class="card-body pagamenti-body">
    <div id="paymentsTable"></div>
  </div>
</div>

<div class="card chart-card">
  <h3>Andamento Pagamenti</h3>
  <div class="chart-wrapper">
    <canvas id="paymentsChart"></canvas>
  </div>
</div>

  <div class="card">
    <h3>Utenti Online</h3>
    <div id="onlineUsers"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/dashboard.js"></script>

</body>
</html>
